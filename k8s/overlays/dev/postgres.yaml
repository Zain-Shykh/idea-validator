# Temporary Postgres so agentops can become Ready: no volume, data is lost with the pod.
# A0 replaces it with the real StatefulSet (pgvector) in k8s/base.
# The password comes from the Secret `db`, created by hand and never committed (docs/setup.md §6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: &labels
    app: postgres
    tier: data
    app.kubernetes.io/part-of: idea-validator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: ideaval
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, ideaval]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/part-of: idea-validator
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
