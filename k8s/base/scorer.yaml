# M10 scorer: FastAPI wrapper + llama.cpp sidecar serving a GGUF from the `models` PVC, which the
# model-import Job fills from the scorer-model image (architecture §14.2, ADR-005).
# A new model: new image tag, file name, Job name and SCORER_MODEL_ID.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scorer
  labels: &labels
    app: scorer
    module: M10
    tier: backend
    app.kubernetes.io/part-of: idea-validator
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: scorer
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      # service links would inject VERDICT_PORT, REDIS_PORT=tcp://... over our env vars
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # the Job renames the finished file into place, so a file that exists is complete
        - name: wait-for-model
          image: &llama-image ghcr.io/ggml-org/llama.cpp:server-v1.1.0@sha256:ce3817b50dae557848c3a5b7df6264f25b08792c9fc39d35b4e67e1d19b15b20
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until [ -s /models/scorer-base-v1.gguf ]; do echo waiting for the model; sleep 5; done
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: scorer
          image: ghcr.io/zain-shykh/idea-validator-scorer:set-by-overlay
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: SCORER_BACKEND
              value: llamacpp
            # the sidecar shares the pod's loopback interface
            - name: SCORER_MODEL_URL
              value: http://127.0.0.1:8080
            - name: SCORER_MODEL_ID
              value: scorer-base@v1
          envFrom:
            - configMapRef:
                name: app-config
          volumeMounts:
            - name: rubrics
              mountPath: /etc/rubrics
              readOnly: true
            - name: prompts
              mountPath: /etc/prompts
              readOnly: true
          # 200 only after the model has answered a probe prompt
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 4
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          # measured under load: docs/evidence/resources.md. The CPU limit stays for startup and
          # probes, and the memory limit is about twice the 61 MiB peak
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
        - name: llama
          image: *llama-image
          imagePullPolicy: IfNotPresent
          # the image's entrypoint is llama-server. Loopback only: it has no authentication.
          # --threads matches the CPU limit; the default counts the node's cores and throttles.
          args:
            - --model
            - /models/scorer-base-v1.gguf
            - --host
            - 127.0.0.1
            - --port
            - "8080"
            - --ctx-size
            - "4096"
            - --parallel
            - "1"
            - --threads
            - "2"
            # the default host prompt cache may grow to 8 GiB, past any limit set here
            - --cache-ram
            - "0"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # exec, because kubelet httpGet probes cannot reach a loopback address.
          # /health is 503 while the model loads.
          startupProbe:
            exec:
              command: &llama-health [curl, -fsS, --max-time, "3", "http://127.0.0.1:8080/health"]
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 60
          readinessProbe:
            exec:
              command: *llama-health
            periodSeconds: 10
            timeoutSeconds: 4
          livenessProbe:
            exec:
              command: *llama-health
            periodSeconds: 20
            timeoutSeconds: 4
            failureThreshold: 6
          # measured under load: docs/evidence/resources.md. The CPU figure is capped by
          # --threads; a new model, --ctx-size or --threads needs a new measurement. About
          # 950 MiB of the memory is the model file, charged to this container only when it
          # is the first to read it: measure after evicting the file from the page cache
          resources:
            requests:
              cpu: 1850m
              memory: 2176Mi
            limits:
              cpu: "2"
              memory: 2720Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models
        - name: tmp
          emptyDir: {}
        - name: rubrics
          configMap:
            name: rubrics
        - name: prompts
          configMap:
            name: prompts
---
apiVersion: v1
kind: Service
metadata:
  name: scorer
  labels:
    app: scorer
    app.kubernetes.io/part-of: idea-validator
spec:
  selector:
    app: scorer
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  labels:
    app: scorer
    app.kubernetes.io/part-of: idea-validator
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 3Gi
---
# Copies the GGUF out of the scorer-model image: the kubelet pulls it, so no pod needs egress.
# Safe to run again: a file with the right checksum is left alone.
apiVersion: batch/v1
kind: Job
metadata:
  name: model-import-base-v1
  labels:
    app: model-import
    app.kubernetes.io/part-of: idea-validator
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    metadata:
      # not app: scorer, or the scorer Service would send requests here
      labels:
        app: model-import
        module: M10
        tier: backend
        app.kubernetes.io/part-of: idea-validator
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-import
          image: ghcr.io/zain-shykh/idea-validator-scorer-model:base-v1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              target=/models/scorer-base-v1.gguf
              want=$(cut -d' ' -f1 /model/model.gguf.sha256)
              if [ -f "$target" ] && [ "$(sha256sum "$target" | cut -d' ' -f1)" = "$want" ]; then
                echo "model already imported"
                exit 0
              fi
              cp /model/model.gguf "$target.tmp"
              echo "$want  $target.tmp" | sha256sum -c -
              mv "$target.tmp" "$target"
              echo "model imported"
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models
