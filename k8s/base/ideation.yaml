# M8 ideation
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ideation
  labels: &labels
    app: ideation
    module: M8
    tier: backend
    app.kubernetes.io/part-of: idea-validator
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ideation
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      # service links would inject VERDICT_PORT, REDIS_PORT=tcp://... over our env vars
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ideation
          image: ghcr.io/zain-shykh/idea-validator-ideation:set-by-overlay
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          volumeMounts:
            - name: prompts
              mountPath: /etc/prompts
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 4
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          # initial plan (architecture §17.2); replaced by measurements in Z11
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: prompts
          configMap:
            name: prompts
---
apiVersion: v1
kind: Service
metadata:
  name: ideation
  labels:
    app: ideation
    app.kubernetes.io/part-of: idea-validator
spec:
  selector:
    app: ideation
  ports:
    - port: 8000
      targetPort: 8000
