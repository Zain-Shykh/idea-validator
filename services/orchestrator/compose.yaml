# Local development only (LOC-2); included by the root docker-compose.yml.
services:
  orchestrator:
    build:
      context: ../..
      dockerfile: services/orchestrator/Dockerfile
    image: idea-validator-orchestrator:${IMAGE_TAG:-dev}
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VERDICT_URL: http://verdict:8000
      VALIDATORS_URL: http://validators:8000
      CRITIC_URL: http://critic:8000
      IDEATION_URL: http://ideation:8000
      # M2, M6 and M4 are not built yet: until then POST /runs answers 503
      PROFILE_URL: ${PROFILE_URL:-http://profile:8000}
      KB_URL: ${KB_URL:-http://kb:8000}
      SCOUTS_URL: ${SCOUTS_URL:-http://scouts:8000}
      # add "profile" when M2 exists
      ORCH_READY_REQUIRES: ${ORCH_READY_REQUIRES:-verdict}
      SCORER_MODEL_ID: ${SCORER_MODEL_ID:-scorer-base@v1}
      AGENTOPS_URL: http://agentops:8000
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ../../rubrics:/etc/rubrics:ro
      - ../../prompts:/etc/prompts:ro
      - ../../config/budgets.yaml:/etc/budgets/budgets.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
      verdict:
        condition: service_started
