# Repo-wide tool configuration (not a package; libs/common has its own pyproject.toml).
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["ASYNC109"]  # per-request httpx timeouts are passed as arguments on purpose

[tool.ruff.lint.isort]
known-first-party = [
    "common", "orchestrator", "ideation", "validators", "scorer", "verdict", "critic", "agentops",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "libs/common/src:services/orchestrator/src:services/ideation/src:services/validators/src:services/scorer/src:services/verdict/src:services/critic/src:services/agentops/src"
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
exclude = ["/tests/"]

[[tool.mypy.overrides]]
module = ["litellm"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["libs", "services", "jobs", "eval"]
# service packages are not installed: images copy src/ and tests import it from here
pythonpath = [
    "services/orchestrator/src",
    "services/ideation/src",
    "services/validators/src",
    "services/scorer/src",
    "services/verdict/src",
    "services/critic/src",
    "services/agentops/src",
    "services/verdict/tests/unit",  # test builders (verdict_factories)
    "services/agentops/tests/unit",  # test builders (trace_factories)
    "services/scorer/tests/unit",  # test builders (scorer_factories)
    "services/validators/tests/unit",  # test builders (validator_factories)
    "services/critic/tests/unit",  # test builders (critic_factories)
]
addopts = "--import-mode=importlib -m 'not integration and not cluster'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Postgres/Redis (docker compose up -d postgres redis)",
    "cluster: needs the minikube cluster",
]
