# Repo-wide tool configuration (not a package; libs/common has its own pyproject.toml).
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["common"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "libs/common/src"
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
exclude = ["/tests/"]

[[tool.mypy.overrides]]
module = ["litellm"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["libs", "services", "jobs", "eval"]
addopts = "--import-mode=importlib -m 'not integration and not cluster'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Postgres/Redis (docker compose up -d postgres redis)",
    "cluster: needs the minikube cluster",
]
